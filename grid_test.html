<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>心就是梯子-而我就是通天的梯</title>
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
    }

    .layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header header"
        "nav    main"
        "footer footer";
      min-height: 100vh;
    }

    .header { grid-area: header; background: #f3f3f3; padding: 12px; }
    .nav    { grid-area: nav;    background: #eaf2ff; padding: 12px; }
    .main   { grid-area: main;   background: #fff; padding: 12px; }
    .footer { grid-area: footer; background: #f3f3f3; padding: 12px; }


    @media (max-width: 600px) {
  .layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr auto;
    grid-template-areas:
      "header"
      "nav"
      "main"
      "footer";
      gap: 12px;
  min-height: 100vh;
  padding: 12px;
  background: #eef1f5;
  }
}
.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.gallery img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
}
.gallery img:first-child {
  grid-column: span 3;
  grid-row: span 3;
  height: 372px; /* 大约 180 * 2 + 12gap */
}

@media (max-width: 600px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>
  <div class="layout">
    <header class="header">标题</header>
    <nav class="nav">导航</nav>
    <main class="main">内容</main>
    <footer class="footer">底部</footer>
  </div>
  <section id="about">
  <h2>一切源自生活</h2>

  <div class="gallery">
    <figure>
      <img src="./images/青菜.jpg" alt="青菜">
      <figcaption>青菜</figcaption>
    </figure>

    <figure>
      <img src="./images/清茶.jpg" alt="清茶">
      <figcaption>清茶</figcaption>
    </figure>

    <figure>
      <img src="./images/清晨.jpg" alt="清心">
      <figcaption>清心</figcaption>
    </figure>
  </div>
</section>
</body>
</html>
