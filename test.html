  <section class="static-tool">
    <h2 class="beauty1">文本统计工具</h2>
    <textarea id="stTextInput" class="hello1" rows="6" placeholder="提示：输入或导入文本..."></textarea>
    <h1 class="beauty2">text static tool</h1>
    <textarea id="stTextInput2" class="hello2"  rows="6" placeholder="这个不准，对比用的。提示：输入或导入文本2..."></textarea>
    
    <div class="btn-group">
      <button id="stImportBtn">导入文本文件</button>
      <button id="stClearBtn">清空</button>
      <input type="file" id="stFileInput" style="background-color: red;" accept=".txt,.md,.csv,.json,.html,.htm,.xml,.js,.css,.log,text/*">
    </div>
    
    <div class="st-stat-line">
        总字数： <span id="stTotalCount">0</span>（含标点/空格）
    </div>
    <div class="st-stat-line">
        不同字符数： <span id="stUniqueCount">0</span>
    </div>
    <div class="st-stat-line st-han-stat">
      汉字总数： <span id="stHanTotal">0</span>
       ｜ 不同汉字数： <span id="stHanUnique">0</span>
      <span  style="font-size:14px;  color:#666;  font-weight:normal;">
      （汉字占比：<span id="stHanRate">0%</span>）
      </span>
    </div>

    <div class="table-wrapper">
      <table id="stResultTable">

        <thead>
          <tr>
            <th style="width:60px;">序号</th>
            <th style="width:70px;">频次</th>
            <th style="width:80px;">频率</th>
            <th>汉字 / 符号（同频次合并）</th>
          </tr>
        </thead>

        <tbody>
            
        </tbody>

      </table>
    </div>

  </section>

  <script src="./test.js"></script>
</body>
</html>
